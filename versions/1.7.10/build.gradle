plugins {
    id("com.gtnewhorizons.gtnhconvention")
}

sourceSets.main.java.srcDir '../../common/src/main/java'
sourceSets.main.resources.srcDir '../../common/src/main/resources'

// A release has one version across metadata, artifacts and both upload services.
Properties releaseProperties = new Properties()
File releaseFile = file("../../version.properties")
if (!releaseFile.isFile()) throw new GradleException("Missing root version.properties")
releaseFile.withInputStream { releaseProperties.load(it) }
String releaseVersion = releaseProperties.getProperty("modVersion", "").trim()
if (!(releaseVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?/)) {
    throw new GradleException("version.properties must contain a valid modVersion (for example 4.0.0)")
}
version = releaseVersion
if (project.findProperty("modVersion") != null && project.findProperty("modVersion").toString() != releaseVersion) {
    throw new GradleException("modVersion override disagrees with version.properties")
}
ext.modVersion = releaseVersion
for (String overrideName : ["VERSION", "RELEASE_VERSION"]) {
    String overrideValue = System.getenv(overrideName)
    if (overrideValue != null && overrideValue != releaseVersion) throw new GradleException(overrideName + " disagrees with version.properties")
}
String tagRef = System.getenv("GITHUB_REF") ?: ""
boolean isTaggedRelease = tagRef.startsWith("refs/tags/")
if (isTaggedRelease && tagRef.substring("refs/tags/".length()).replaceFirst(/^v/, "") != releaseVersion) {
    throw new GradleException("Release tag must match version.properties: " + releaseVersion)
}
boolean stableRelease = isTaggedRelease && !releaseVersion.contains("-")
base { archivesName = "uab" }
tasks.withType(AbstractArchiveTask).configureEach {
    archiveBaseName = "uab"
    archiveVersion = releaseVersion + "+mc" + project.minecraftVersion
}

minecraft {
    injectedTags.put("MOD_ID", project.modId)
    injectedTags.put("MOD_NAME", project.modName)
    injectedTags.put("MOD_GROUP", project.modGroup)
    injectedTags.put("VERSION", releaseVersion)

    //Returns true if this build isn't a tagged release build, meaning it came from the CI (or was arbitrarily built)
    injectedTags.put("SNAPSHOT_BUILD", !isTaggedRelease)
    //Returns true if this build is a tagged build, and contains no version keywords that may indicate it possibly being a pre-release tagged build.
    injectedTags.put("STABLE_BUILD", stableRelease)
    // SNAPSHOT_BUILD == false but STABLE_BUILD == false means this release is a tagged beta, alpha, release candidate, etc.
    // Neither of these values can be true at the same time.

    injectedTags.put("MC_ASSET_VER", "minecraft_1.21.11")
}

tasks.register("configurationTest", JavaExec) {
    group = "verification"
    description = "Exercises native Forge configuration, legacy migration and spawn parameter validation."
    dependsOn(tasks.named("testClasses"))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "ganymedes01.etfuturum.configuration.ConfigurationTest"
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named("check") { dependsOn(tasks.named("configurationTest")) }

tasks.register("fenceTextureTest", JavaExec) {
    group = "verification"
    description = "Checks native and delegated fence texture registration across resource reloads."
    dependsOn(tasks.named("testClasses"))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "ganymedes01.etfuturum.blocks.FenceTextureTest"
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
tasks.named("check") { dependsOn(tasks.named("fenceTextureTest")) }
tasks.named("test") {
    dependsOn(tasks.named("configurationTest"))
    dependsOn(tasks.named("fenceTextureTest"))
    // The regression suites use plain Java entry points rather than JUnit discovery.
    failOnNoDiscoveredTests = false
}

def releaseMetadataOutput = layout.buildDirectory.file("release/uab-update.json")
String releaseMinecraftVersion = project.minecraftVersion.toString()
tasks.register("generateReleaseMetadata") {
    inputs.file(file("../../version.properties"))
    inputs.property("minecraftVersion", releaseMinecraftVersion)
    outputs.file(releaseMetadataOutput)
    doLast {
        File output = releaseMetadataOutput.get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            homepages: [GitHub: "https://github.com/RagexPrince683/Et-Futurum-Requiem-Reforged/releases/tag/v" + releaseVersion],
            promos: [(releaseMinecraftVersion + "-latest"): releaseVersion]
        ])) + "\n"
    }
}
tasks.named("build") { dependsOn(tasks.named("generateReleaseMetadata")) }

sourceSets.main.java.srcDir '../../common/src/forge/java'

sourceSets.test.java.srcDir '../../common/src/forgeTest/java'
tasks.register('catalogMigrationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ganymedes01.etfuturum.configuration.TargetConfigurationTest'
    systemProperty 'uab.test.target', '1.7.10'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
check.dependsOn catalogMigrationTest
test.dependsOn catalogMigrationTest
