name: Update issue submitter leaderboard

on:
  issues:
    types: [closed, reopened, labeled, unlabeled, edited, deleted, transferred]
  label:
    types: [edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions: {}

concurrency:
  group: uab-issue-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
    outputs:
      needs_pr: ${{ steps.publish.outputs.needs_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test leaderboard generator
        run: node --test tools/issue-leaderboard/update.test.mjs
      - name: Regenerate leaderboard from full issue history
        run: node tools/issue-leaderboard/update.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed README or request PR fallback
        id: publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: update issue submitter leaderboard'
          if ! git push origin "HEAD:$DEFAULT_BRANCH"; then
            echo 'Direct push failed; updating the leaderboard through a pull request.'
            echo 'needs_pr=true' >> "$GITHUB_OUTPUT"
          fi

  pull-request-fallback:
    needs: update
    if: needs.update.outputs.needs_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate against the latest default branch
        run: node tools/issue-leaderboard/update.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/issue-leaderboard
          base: ${{ github.event.repository.default_branch }}
          add-paths: README.md
          commit-message: 'docs: update issue submitter leaderboard'
          title: 'docs: update issue submitter leaderboard'
          body: 'Refresh the Top Issue Submitters table from completed bug and enhancement issues, crediting their original creators. Direct updates to the default branch were unavailable.'
