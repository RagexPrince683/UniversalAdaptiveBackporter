name: Build UAB
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify UAB
        run: ./gradlew buildAll --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: UAB-Forge-Multiversion
          path: |
            versions/1.7.10/build/libs/uab-*.jar
            versions/1.12.2/build/libs/uab-*.jar
            build/release/uab-update.json
